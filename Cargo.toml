[workspace]
members = ["crates/lazycmake-core", "crates/lazycmake-tui"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.3"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
crossbeam-channel = "0.5"
dirs = "6.0"
nucleo-matcher = "0.3"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
