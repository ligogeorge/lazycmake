name: Release

# Build prebuilt binaries and attach them to a GitHub Release.
#
# Create a release:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Or re-run for an existing tag via Actions → Release → Run workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Required for workflow_dispatch."
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p lazycmake-tui --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          BIN="target/${TARGET}/release/lazycmake"
          # strip may already be done by profile.release; ignore failures on macOS fat/cross
          strip "$BIN" 2>/dev/null || true
          STAGE="lazycmake-${TAG}-${TARGET}"
          mkdir -p dist "$STAGE"
          cp "$BIN" "$STAGE/lazycmake"
          cp README.md LICENSE "$STAGE/"
          ARCHIVE="dist/${STAGE}.tar.gz"
          tar -czf "$ARCHIVE" "$STAGE"
          (cd dist && shasum -a 256 "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "target/$env:TARGET/release/lazycmake.exe"
          $stage = "lazycmake-$env:TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist, $stage | Out-Null
          Copy-Item $bin "$stage/lazycmake.exe"
          Copy-Item README.md, LICENSE $stage
          $archive = "dist/$stage.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          Set-Content -Path "$archive.sha256" -Value "$hash  $(Split-Path $archive -Leaf)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazycmake-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Release ${{ inputs.tag || github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
